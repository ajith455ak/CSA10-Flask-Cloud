name: Flask Cloud CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short test_app.py

  deploy:
    name: Cloud Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Cloud Environment
        run: |
          echo "Deploying CSA10 Flask API to Cloud Target..."
          echo "Target Environment: Production Cloud Runner"
          echo "Artifact: ajith455ak/csa10-flask-cloud:v1.0"
          echo "Deployment successful for student Ajith Kumar R (192321144)!"
